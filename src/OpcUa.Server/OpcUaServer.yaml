Common:
  Target       : DataPort                                                                          # required: Id String to identify the target of the file
  ContentType  : Rules                                                                             # required: Id String to identify the content of the file
  Version      : 1.0                                                                               # required: Version of the file
  Date         : 2024-12-03                                                                        # required: Date of the file
  Description  : "OPC-UA Server DataPort"                                                          # required: Description of the file
  Author       : "ifm software gmbh"                                                               # required: Author of the file
  MetadataType : YAML                                                                              # required: Metadata type of the file (YAML, JSON, XML, Text, Binary, ...)

Root:
  Id                       : "OpcUaServerDataPort"                                                 # required: Id String to identify the root of the DataPort
  Name                     : "OPC-UA Server"                                                       # required: display name of the DataPort
  Description              : "Server DataPort for OPC-UA"                                          # required: display description of the DataPort
  Icons                    : ['opcua-server']                                                      # required: just one Icon for the DataPort
  ChildNodes               :
    - Id                   : OPCUA-Server
      MaxDepth             : 64
      MaxInstances         : 8

Nodes:

  # -------------------- OPCUA-Server ------------------------------------

  - Id                     : OPCUA-Server
    Type                   : DataPortNode
    Name                   : "Server"
    Description            : "Server"
    MetadataLength         : 0
    Icons                  : ['folder']
    TransferDirections     : [ Outbound, Inbound ]
    ChildNodes             :
      - Id                 : Folder
        Required           : true
    PropertyCategories     :
      - Id                 : Connection
        Properties         :
          - Id             : ApplicationName
            Required       : true
          - Id             : ApplicationUri
            Required       : true
          - Id             : Namespace
            Required       : true
          - Id             : Server
            Required       : true
          - Id             : Port
            Required       : true
          - Id             : Endpoint
            Required       : true
          - Id             : TransportQuotas
      - Id                 : Authentication
        Properties         :
          - Id             : UserAuthenticationType
            Required       : true
          - Id             : User
          - Id             : Password
      - Id                 : Certificate
        Properties         :
          - Id             : ApplicationCertificateSubject
            Required       : true
          - Id             : ApplicationCertificatesStoreType
            Required       : true
          - Id             : ApplicationCertificatesStorePath
            Required       : true
          - Id             : TrustedCertificatesStoreType
          - Id             : TrustedCertificatesStorePath
          - Id             : TrustedIssuerCertificatesStoreType
          - Id             : TrustedIssuerCertificatesStorePath
          - Id             : AutoAcceptUntrustedCertificates

  # -------------------- Folder ------------------------------------------

  - Id                     : Folder
    MappingId              : Folder
    Type                   : DataPortTreeNode
    Name                   : "Folder"
    Description            : "Folder in the OPC-UA Topic Tree"
    Icons                  : ['folder']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : Folder
      - Id                 : DataPointBool
      - Id                 : DataPointInteger
      - Id                 : DataPointFloat
      - Id                 : DataPointDateTime
      - Id                 : DataPointString
      - Id                 : DataPointBinary

  # -------------------- DataPoints --------------------------------------

  - Id                     : DataPointBool
    MappingId              : Variable
    Type                   : DataPortTreeNode
    Name                   : "DataPoint Bool"
    Description            : "Boolean data point in the OPC-UA tree"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Bool ]
    PropertyCategories     :
      - Id                 : Other
        Properties         :
          - Id             : ReadOnly

  - Id                     : DataPointInteger
    MappingId              : Variable
    Type                   : DataPortTreeNode
    Name                   : "DataPoint Integer"
    Description            : "Integer data point in the OPC-UA tree"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Int32, Int64, Int16, Int8, UInt32, UInt64, UInt16, UInt8 ]
    PropertyCategories     :
      - Id                 : Other
        Properties         :
          - Id             : ReadOnly

  - Id                     : DataPointFloat
    MappingId              : Variable
    Type                   : DataPortTreeNode
    Name                   : "DataPoint Float"
    Description            : "Float data point in the OPC-UA tree"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Float64, Float32 ]
    PropertyCategories     :
      - Id                 : Other
        Properties         :
          - Id             : ReadOnly

  - Id                     : DataPointDateTime
    MappingId              : Variable
    Type                   : DataPortTreeNode
    Name                   : "DataPoint DateTime"
    Description            : "DateTime data point in the OPC-UA tree"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ DateTime ]
    PropertyCategories     :
      - Id                 : Other
        Properties         :
          - Id             : ReadOnly

  - Id                     : DataPointString
    MappingId              : Variable
    Type                   : DataPortTreeNode
    Name                   : "DataPoint String"
    Description            : "String data point in the OPC-UA tree"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ String ]
    PropertyCategories     :
      - Id                 : Other
        Properties         :
          - Id             : ReadOnly

  - Id                     : DataPointBinary
    MappingId              : Variable
    Type                   : DataPortTreeNode
    Name                   : "DataPoint Binary"
    Description            : "Binary data point in the OPC-UA tree"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Binary ]
    PropertyCategories     :
      - Id                 : Other
        Properties         :
          - Id             : ReadOnly

PropertyCategories:
  - Id          : Connection
    Name        : "Connection"
    Description : "Connection properties"

  - Id          : Authentication
    Name        : "Authentication"
    Description : "Authentication properties"

  - Id          : Certificate
    Name        : "Certificate"
    Description : "Certificate properties"

  - Id          : Other
    Name        : "Other"
    Description : "Other properties"

Properties:
  - Id          : ApplicationName
    Name        : "Application Name"
    Description : "The name of the application"
    DataType    : String
    UiControl   : TextBox
    DefaultValue: "OPC-UA Server"

  - Id          : ApplicationUri
    Name        : "Application URI"
    Description : "The URI of the application"
    DataType    : String
    UiControl   : TextBox
    DefaultValue: "urn:localhost:OPCUA:Server"

  - Id          : Namespace
    Name        : "Namespace"
    Description : "The namespace of the OPC-UA server"
    DataType    : String
    UiControl   : TextBox
    DefaultValue: "http://ifm.com/vicione-suite"

  - Id          : Server
    Name        : "Server"
    Description : "The server of the OPC-UA server"
    DataType    : String
    UiControl   : TextBox
    DefaultValue: "0.0.0.0"

  - Id          : Port
    Name        : "Port"
    Description : "The port of the OPC-UA server"
    DataType    : Int32
    UiControl   : NumericUpDown
    DefaultValue: 4840
    MinValue    : 0
    MaxValue    : 65535

  - Id          : Endpoint
    Name        : "Endpoint"
    Description : "The endpoint of the OPC-UA server"
    DataType    : String
    UiControl   : TextBox
    DefaultValue: "ua/dataport"

  - Id                 : UserAuthenticationType
    Name               : "User Authentication Type"
    Description        : "The type of user authentication."
    DataType           : UInt8
    UiControl          : NumericListBox
    DefaultValue       : 0
    MinValue           : 0
    MaxValue           : 1
    Elements           : { 0: 'Anonymous',
                           1: 'Basic' }
    DependentProperties: { 'User'    : [1],
                           'Password': [1] }

  - Id          : User
    Name        : "User"
    Description : "The user"
    DataType    : String
    UiControl   : TextBox

  - Id          : Password
    Name        : "Password"
    Description : "The password"
    DataType    : String
    UiControl   : PasswordBox

  - Id          : ApplicationCertificateSubject
    Name        : "Application Certificate Subject"
    Description : "The subject of the application certificate."
    DataType    : String
    UiControl   : TextBox
    DefaultValue: "CN=OPC-UA Server, DC=localhost"

  - Id          : ApplicationCertificatesStoreType
    Name        : "Application Certificates - Store Type"
    Description : "The type of the certificate store."
    DataType    : UInt8
    UiControl   : NumericListBox
    DefaultValue: 1
    MinValue    : 1
    MaxValue    : 2
    Elements    : { 0: 'None',
                    1: 'X509 Store',
                    2: 'Directory' }

  - Id          : ApplicationCertificatesStorePath
    Name        : "Application Certificates - Store Path"
    Description : "The path to the certificate store or the name in case of a 'X509 Store'."
    DataType    : String
    UiControl   : TextBox
    DefaultValue: "CurrentUser\\My"

  - Id          : TrustedCertificatesStoreType
    Name        : "Trusted Certificates - Store Type"
    Description : "The type of the certificate store."
    DataType    : UInt8
    UiControl   : NumericListBox
    DefaultValue: 0
    MinValue    : 0
    MaxValue    : 2
    Elements    : { 0: 'None',
                    1: 'X509 Store',
                    2: 'Directory' }

  - Id          : TrustedCertificatesStorePath
    Name        : "Trusted Certificates - Store Path"
    Description : "The path to the certificate store or the name in case of a 'X509 Store'."
    DataType    : String
    UiControl   : TextBox

  - Id          : TrustedIssuerCertificatesStoreType
    Name        : "Trusted Issuer Certificates - Store Type"
    Description : "The type of the certificate store."
    DataType    : UInt8
    UiControl   : NumericListBox
    DefaultValue: 0
    MinValue    : 0
    MaxValue    : 2
    Elements    : { 0: 'None',
                    1: 'X509 Store',
                    2: 'Directory' }

  - Id          : TrustedIssuerCertificatesStorePath
    Name        : "Trusted Issuer Certificates - Store Path"
    Description : "The path to the certificate store or the name in case of a 'X509 Store'."
    DataType    : String
    UiControl   : TextBox

  - Id          : AutoAcceptUntrustedCertificates
    Name        : "Auto Accept Untrusted Certificates"
    Description : "Auto accept untrusted certificates."
    DataType    : Bool
    UiControl   : CheckBox
    DefaultValue: false

  - Id          : TransportQuotas
    Name        : "Transport Quotas"
    Description : "Enable custom transport quotas to harden against denial-of-service attacks."
    DataType    : Bool
    UiControl   : CheckBox
    DefaultValue: true

  - Id          : ReadOnly
    Name        : "Read only"
    Description : "Read only"
    DataType    : Bool
    UiControl   : CheckBox
    DefaultValue: false
