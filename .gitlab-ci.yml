include:
  - project: 'vicione-oss/tooling/templates'
    file: '/CI-Templates/v2/dotnet.yml'
  - project: 'vicione-oss/tooling/ci-templates'
    file: '/project/v1/dotnet.yml'

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0

Build:
  extends: .dotnet-build

Unit tests:
  extends: .dotnet-test-xunit
  variables:
    FILTER: 'Category!=Interoperability'
  artifacts:
    reports:
      junit: artifacts/tests/*-test-report.xml

Interoperability tests:
  extends: .dotnet-test-xunit
  variables:
    FILTER: 'Category=Interoperability'
    DOCKER_HOST: tcp://docker:2375
  services:
    - docker:dind
  coverage: '/no coverage/'
  artifacts:
    reports:
      junit: artifacts/tests/*-test-report.xml
  when: manual

# Prerelease

Prerelease DataPort NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/DataPort/DataPort.csproj'
    REPO: 'JFrogViciOne'

Prerelease Dataport.Extensions NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/DataPort.Extensions/DataPort.Extensions.csproj'
    REPO: 'JFrogViciOne'

Prerelease Dataport.Extensions.Testing NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/DataPort.Extensions.Testing/DataPort.Extensions.Testing.csproj'
    REPO: 'JFrogViciOne'

Prerelease HTTP Client Raw:
  extends: .dotnet-deploy-raw-rids
  variables:
    SERVER: 'https://ifm.jfrog.io/artifactory/vicione-suite-dev'
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    PROJECT: 'src/Http.Client/Http.Client.csproj'
    DST_DIRECTORY: 'fbs/ViciOne.Suite.DataPort.Http.Client'
    METADATA_FILE: 'src/Http.Client/metadata.json'
    METADATA_VERSION_FILE: 'VERSION'
    METADATA_MIN_VERSION_FILE: 'VERSION_CORE'
    METADATA_MIN_VERSION_KEY: 'MinCoreVersion'
  after_script:
    - !reference [ .push-metadata ]

Prerelease InfluxDb Raw:
  extends: .dotnet-deploy-raw-rids
  variables:
    SERVER: 'https://ifm.jfrog.io/artifactory/vicione-suite-dev'
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    PROJECT: 'src/InfluxDb/InfluxDb.csproj'
    DST_DIRECTORY: 'fbs/ViciOne.Suite.DataPort.InfluxDb'
    METADATA_FILE: 'src/InfluxDb/metadata.json'
    METADATA_VERSION_FILE: 'VERSION'
    METADATA_MIN_VERSION_FILE: 'VERSION_CORE'
    METADATA_MIN_VERSION_KEY: 'MinCoreVersion'
  after_script:
    - !reference [ .push-metadata ]

Prerelease Http Server Raw:
